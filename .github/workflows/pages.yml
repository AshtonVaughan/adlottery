# Builds the static site and publishes it to GitHub Pages.
# Settings -> Pages -> Source must be "GitHub Actions".
#
# Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
#   SUPABASE_URL, SUPABASE_ANON_KEY   (both public; without them the site runs in demo mode)
#   Optional: APP_NAME, CURRENCY, AD_SHARE_PERCENT, EXCLUDED_COUNTRIES,
#             SPONSOR_CONTACT, ADSENSE_CLIENT, ADSENSE_SLOT
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_APP_URL: ${{ steps.pages.outputs.origin }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.APP_NAME }}
          NEXT_PUBLIC_CURRENCY: ${{ vars.CURRENCY }}
          NEXT_PUBLIC_AD_SHARE_PERCENT: ${{ vars.AD_SHARE_PERCENT }}
          NEXT_PUBLIC_EXCLUDED_COUNTRIES: ${{ vars.EXCLUDED_COUNTRIES }}
          NEXT_PUBLIC_SPONSOR_CONTACT: ${{ vars.SPONSOR_CONTACT }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEXT_PUBLIC_ADSENSE_SLOT: ${{ vars.ADSENSE_SLOT }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
